# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "A Hahn-series coefficientwise proof of the Hickerson--Mortenson Hecke--Appell identities"
  description: >-
    A Lean 4 verification of the coefficientwise Kronecker partial-fraction
    identity and the general boundary-cleared Hickerson--Mortenson
    Hecke--Appell identity for f_{n,n+p,n}, for all positive integers n and p.
  authors:
    - "Xiang Huang"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Xiang Huang"

classification:
  arxiv: [math.NT]
  msc2020: [11F27, 33D15]

sources:
  - title: "A Hahn-Series Coefficientwise Proof of the Hickerson--Mortenson Hecke--Appell Identities"
    authors:
      - "Xiang Huang"
    type: paper
    relationship: formalizes
    note: >-
      The selected theorem formalizes the paper's general positive-(n,p)
      boundary-cleared identity in its intended coefficientwise form.
  - title: "Hecke-type double sums, Appell--Lerch sums, and mock theta functions, I"
    authors:
      - "Dean Hickerson"
      - "Eric Mortenson"
    id: "doi:10.1112/plms/pdu007"
    type: paper
    location: "https://doi.org/10.1112/plms/pdu007"
    relationship: independently-proves
    note: >-
      The present proof gives a new signed Hahn-branch coefficient argument
      for the general boundary-cleared Hecke--Appell family.

related_formalizations: []

status:
  scope: >-
    Comparator checks two declarations: the cleared coefficientwise
    Kronecker identity used in Appendix A, and the explicit general
    Hickerson--Mortenson coefficient identity for every positive n,p. The
    proof includes signed Hahn inverse coefficients, coefficient-local
    finiteness, row-exponent collapse, both finite residue families, the
    five-index expansion of the printed correction, and its identification
    with the wall term.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]

automation:
  methods:
    - method: agent
      models: ["Claude", "ChatGPT", "OpenAI Codex"]
      framework: "Lean 4 with remote build and multi-model review"
      tool_setup: >-
        AI-assisted proof development, source comparison, dependency auditing,
        clean builds, and axiom inspection under human direction.
      cost:
        wall_time: "not reconstructed"
        spend_usd: "subscription-based"
        hardware: "Mac mini orchestration and uisai2 Linux verification"
      prompting_notes: >-
        Agents proposed and reviewed proof steps; every retained declaration
        was checked by Lean and the advertised theorem was axiom-audited.
  spend_usd: "subscription-based"
  notes: >-
    The final submission record will retain only claims supported by the pinned
    public source and Comparator result.

fidelity:
  divergences: >-
    The formal statement records equality of every q,x,y coefficient after
    clearing the common Jacobi factor. It proves local finiteness at each
    coefficient but does not assert a global well-ordered-support theorem or a
    series-valued Hahn wrapper for the assembled families. The registered
    coefficient functions are rational-valued; the paper's integer-valued
    interpretation, integrality, and arbitrary-ring base change are not
    separate registered Lean theorems.

review:
  status: "agent-reviewed"
  reviewers:
    - "OpenAI Codex"
    - "OpenAI GPT-5.6 Sol (independent max-effort audit)"
  notes: >-
    The paper and Lean definitions were compared claim by claim. The extracted
    proof closure was rebuilt on uisai2 and both selected declarations were
    checked to use only Palomar-permitted axioms. The independent audit found
    no mismatch in the quantified parameters, residue ranges, signs, parity,
    exponents, or five-index Hickerson--Mortenson comparison; its scope
    correction about global Hahn support is incorporated here.

alignment:
  namespace: "PalomarHahnHeckeAppell"
  statements:
    - source: "Appendix A, cleared coefficientwise Kronecker partial-fraction identity"
      lean: "PalomarHahnHeckeAppell.kronecker_partial_fraction_cleared_coefficient"
      module: "Challenge"
      status: proved
      note: >-
        Identifies every coefficient of the Jacobi-cleared bilateral
        Kronecker sum with the corresponding shifted partial-fraction
        coefficient.
    - source: "General boundary-cleared Hickerson--Mortenson coefficient identity"
      lean: "PalomarHahnHeckeAppell.general_boundary_cleared_hm_coefficient"
      module: "Challenge"
      status: proved
      note: >-
        For every positive n,p and every q,x,y exponent triple, this equates
        the explicit Hecke coefficient with the two finite cleared Appell
        residue-row coefficients plus the five-index expansion of the printed
        Hickerson--Mortenson correction.

acknowledgements: >-
  Mathlib and Lean provide the formal foundation. The original identity is due
  to Dean Hickerson and Eric Mortenson.
