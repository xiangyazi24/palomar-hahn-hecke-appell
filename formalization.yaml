# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "General Hahn-series coefficientwise Hecke--Appell identities"
  description: >-
    A Lean 4 verification of the boundary-cleared coefficient identity for
    f_{n,n+p,n}, for all positive integers n and p. The audited statement
    equates each Hecke coefficient with two explicit finite families of
    cleared Appell residue rows plus the wall correction coefficient.
  authors:
    - "Xiang Huang"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Xiang Huang"

classification:
  arxiv: [math.NT]
  msc2020: [11F27, 33D15]

sources:
  - title: "A Hahn-Series Coefficientwise Proof of the Hickerson--Mortenson Hecke--Appell Identities"
    authors:
      - "Xiang Huang"
    type: paper
    relationship: formalizes
    note: >-
      The selected theorem formalizes the paper's general positive-(n,p)
      boundary-cleared identity in its intended coefficientwise form.
  - title: "Hecke-type double sums, Appell--Lerch sums, and mock theta functions, I"
    authors:
      - "Dean Hickerson"
      - "Eric Mortenson"
    id: "doi:10.1112/plms/pdu007"
    type: paper
    location: "https://doi.org/10.1112/plms/pdu007"
    relationship: independently-proves
    note: >-
      The present proof gives a new signed Hahn-branch coefficient argument
      for the general boundary-cleared Hecke--Appell family.

related_formalizations: []

status:
  scope: >-
    Comparator checks the explicit general coefficient identity for every
    positive n,p. The proof includes the signed Hahn inverse recurrence,
    denominator branch sign, row-exponent collapse, monomial forcing of both
    finite residue families, local finiteness, and wall-term assembly. The
    separate analytic Kronecker comparison with the printed
    Hickerson--Mortenson theta quotient is not part of this entry.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]

automation:
  methods:
    - method: agent
      models: ["Claude", "ChatGPT", "OpenAI Codex"]
      framework: "Lean 4 with remote build and multi-model review"
      tool_setup: >-
        AI-assisted proof development, source comparison, dependency auditing,
        clean builds, and axiom inspection under human direction.
      cost:
        wall_time: "not reconstructed"
        spend_usd: "subscription-based"
        hardware: "Mac mini orchestration and uisai2 Linux verification"
      prompting_notes: >-
        Agents proposed and reviewed proof steps; every retained declaration
        was checked by Lean and the advertised theorem was axiom-audited.
  spend_usd: "subscription-based"
  notes: >-
    The final submission record will retain only claims supported by the pinned
    public source and Comparator result.

fidelity:
  divergences: >-
    The theorem is stated coefficientwise because the wall correction need not
    be an element of the selected q-first Hahn ring for n at least 2. The
    independent analytic Kronecker comparison identifying this wall
    coefficient with the printed Hickerson--Mortenson theta quotient remains
    outside the selected statement.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude"
    - "OpenAI Codex"
  notes: >-
    The paper and Lean definitions were compared claim by claim. The target
    modules were rebuilt on uisai2 and the selected declaration was checked to
    use only propext, Classical.choice, and Quot.sound.

alignment:
  namespace: "PalomarHahnHeckeAppell"
  statements:
    - source: "General boundary-cleared Hecke--Appell coefficient identity"
      lean: "PalomarHahnHeckeAppell.general_boundary_cleared_coefficient"
      module: "Challenge"
      status: proved
      note: >-
        For every positive n,p and every q,x,y exponent triple, this equates
        the explicit Hecke coefficient with the two finite cleared Appell
        residue-row coefficients plus the wall correction coefficient.

acknowledgements: >-
  Mathlib and Lean provide the formal foundation. The original identity is due
  to Dean Hickerson and Eric Mortenson.
