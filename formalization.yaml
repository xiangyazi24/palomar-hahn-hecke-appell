# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Hahn-series coefficientwise Hecke--Appell identities"
  description: >-
    A Lean 4 formalization of the f_{2,3,2} special case of the
    Hickerson--Mortenson Hecke--Appell identity and of the general algebraic
    mechanism used in a new Hahn-series coefficientwise proof: the row-exponent
    collapse, branch-sign equivalences, parity transport, and wall involution.
  authors:
    - "Xiang Huang"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Xiang Huang"

classification:
  arxiv: [math.NT]
  msc2020: [11F27, 33D15]

sources:
  - title: "A Hahn-Series Coefficientwise Proof of the Hickerson--Mortenson Hecke--Appell Identities"
    authors:
      - "Xiang Huang"
    type: paper
    relationship: formalizes
    note: >-
      The Lean development formalizes the f_{2,3,2} specialization and the
      general row-exponent and branch-sign algebra, not the paper's full
      general-(n,p) assembly.
  - title: "Hecke-type double sums, Appell--Lerch sums, and mock theta functions, I"
    authors:
      - "Dean Hickerson"
      - "Eric Mortenson"
    id: "doi:10.1112/plms/pdu007"
    type: paper
    location: "https://doi.org/10.1112/plms/pdu007"
    relationship: independently-proves
    note: >-
      The present Hahn-series proof independently proves a specialization of
      the published Hecke--Appell identity by a coefficientwise algebraic route.

related_formalizations: []

status:
  scope: >-
    The substantive development proves the f_{2,3,2} Hecke--Appell identity and
    the general row-exponent, branch-sign, parity, and wall-involution lemmas.
    The Kronecker comparison and full general-(n,p) assembly in the paper are
    not formalized. The current preliminary Comparator configuration advertises
    only the general row-exponent identity and is not submission-ready.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]

automation:
  methods:
    - method: agent
      models: ["Claude", "ChatGPT", "OpenAI Codex"]
      framework: "Lean 4 with remote build and multi-model review"
      tool_setup: >-
        AI-assisted proof development, source comparison, dependency auditing,
        clean-checkout builds, and axiom inspection under human direction.
      cost:
        wall_time: "not reconstructed"
        spend_usd: "subscription-based"
        hardware: "Mac mini orchestration and uisai2 Linux verification"
      prompting_notes: >-
        Agents proposed and reviewed proof steps; every retained declaration was
        checked by Lean, and the advertised theorem chain was rebuilt from a
        clean source snapshot.
  spend_usd: "subscription-based"
  notes: >-
    The final submission record will retain only claims supported by the pinned
    public source and Comparator result.

fidelity:
  divergences: >-
    The paper proves the Hickerson--Mortenson family for general positive n and
    p. Lean currently verifies the f_{2,3,2} specialization and the general
    algebraic mechanism, but not the Kronecker comparison or full general
    assembly. The preliminary Challenge exposes only the row-exponent identity.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude"
    - "OpenAI Codex"
  notes: >-
    The paper and Lean scope were compared explicitly. The target modules were
    rebuilt from a clean checkout, and the principal declarations were checked
    to use only propext, Classical.choice, and Quot.sound.

alignment:
  namespace: "PalomarHahnHeckeAppell"
  statements:
    - source: "Proposition 2.6 (row-exponent identity)"
      lean: "PalomarHahnHeckeAppell.row_exponent_identity"
      module: "Challenge"
      status: proved
      note: "The preliminary Comparator target matches the paper's integral row-exponent identity."
    - source: "The f_{2,3,2} Hecke--Appell specialization"
      lean: "QseriesFormalization.Pending.Ch10M3Ghat.Fhm_eq_Ghat_via_uvOmega"
      module: "QseriesFormalization.Pending.Chapter10_M3_AppellCoeffNF"
      status: proved
      note: >-
        Present in the substantive development but not yet exposed by the
        preliminary Challenge/Comparator pair.

acknowledgements: >-
  Mathlib and Lean provide the formal foundation. The mathematical identity is
  due to Dean Hickerson and Eric Mortenson.
